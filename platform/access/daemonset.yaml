# aws-iam-authenticator server — DaemonSet restricted to the control plane.
#
# Why a DaemonSet and not a static pod: static pods cannot reference
# ConfigMaps, and the DynamicFile mappings live in one (ADR-005). With HA
# (Sprint 2) this scales to the 3 CPs by itself.
#
# Image: upstream publishes NO container image for v0.7.18 (deploy/example.yaml
# expects a self-built one). The public de-facto build is EKS Distro's; pinned
# by DIGEST on the eks-1-35 variant (matches our Kubernetes series).
#
# hostNetwork: the API server (also host network) reaches the webhook at
# https://localhost:21362/authenticate — the URL inside the kubeconfig that
# `aws-iam-authenticator init` generated at bootstrap.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: aws-iam-authenticator
  namespace: kube-system
  labels:
    k8s-app: aws-iam-authenticator
    app.kubernetes.io/part-of: k8s-vanilla-lab-access
spec:
  selector:
    matchLabels:
      k8s-app: aws-iam-authenticator
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        k8s-app: aws-iam-authenticator
    spec:
      hostNetwork: true
      automountServiceAccountToken: false
      priorityClassName: system-node-critical
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: aws-iam-authenticator
          image: public.ecr.aws/eks-distro/kubernetes-sigs/aws-iam-authenticator:v0.7.18-cvefix-eks-1-35-12@sha256:62facbde77d6edb8c2dcd37a7a50b58922fe4f8838d49d6d431e5037b1e4ca62
          args:
            - server
            - --config=/etc/aws-iam-authenticator/config.yaml
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 96Mi
          volumeMounts:
            - name: config
              mountPath: /etc/aws-iam-authenticator
              readOnly: true
            - name: state
              mountPath: /var/aws-iam-authenticator
              readOnly: true
      volumes:
        # config.yaml + dynamic-mappings.json — rendered by platform/install.sh
        # from platform/access/profiles.yaml; the authenticator reloads mapping
        # changes without touching the control plane.
        - name: config
          configMap:
            name: aws-iam-authenticator
        # cert.pem/key.pem generated by `aws-iam-authenticator init` at bootstrap
        - name: state
          hostPath:
            path: /var/aws-iam-authenticator
            type: Directory
