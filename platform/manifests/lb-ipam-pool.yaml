# Cilium LB-IPAM pool — assigns virtual IPs to LoadBalancer Services.
#
# Without a cloud LoadBalancer controller (no cloud-controller-manager in this
# lab), the Gateway's generated Service stays Pending forever and Cilium never
# marks the Gateway Programmed=True. LB-IPAM is built into Cilium (dormant
# until the first pool exists): with this pool, the Service gets an IP and the
# Gateway becomes Programmed.
#
# The CIDR is deliberately OUTSIDE the VPC (10.0.0.0/16): these are virtual
# LoadBalancer IPs that are assigned but NOT announced externally (no BGP, no
# L2 announcements, no AWS routes — a real NLB is the Sprint 2 ingress
# decision). External access is the internet-facing NLB (S2-2): TCP/443
# passthrough to the deterministic NodePort, which only answers to the
# NLB's security group.
#
# serviceSelector scopes the pool to LoadBalancer Services in the infra
# namespace (matched via Cilium's reserved io.kubernetes.service.namespace
# label, so the Gateway's generated Service needs no labels of its own) —
# future LB Services elsewhere must opt in via their own pool.
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: infra-pool
spec:
  blocks:
    - cidr: "172.20.255.0/24"
  serviceSelector:
    matchLabels:
      io.kubernetes.service.namespace: infra
