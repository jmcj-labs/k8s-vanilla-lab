# Per-node readiness aggregator — Pieza 0 de Fase 2, cierre de INCIDENTS #20.
#
# WHY IT EXISTS, measured and not assumed. On 2026-08-31, with one worker's
# cilium-envoy process stopped and its agent alive, 22 consecutive samples
# showed the NLB target group reporting that worker HEALTHY while Kubernetes
# had already marked its Envoy pod NotReady and its NodePort kept accepting
# TCP. Kubernetes knew and the load balancer did not
# (docs/evidence/h3-2026-08-31/).
#
# The NLB health check probes the Gateway NodePort, which Cilium's agent
# programs INDEPENDENTLY of whether the local Envoy can serve. This endpoint
# gives the balancer a signal that covers both.
#
# WORKERS ONLY. The Gateway does not serve on control planes, so a readiness
# answer from a CP would be meaningless and its 503s would be noise.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-readiness
  namespace: infra
  labels:
    app.kubernetes.io/name: node-readiness
    app.kubernetes.io/component: platform
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: node-readiness
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-readiness
        app.kubernetes.io/component: platform
    spec:
      # PORT 8910. WHY, and what was actually checked -- written down so the
      # next person does not repeat the cycle.
      #
      # The component was written for :9890 while it was a prototype that was
      # never deployed, and cilium-agent holds 127.0.0.1:9890. Binding
      # 0.0.0.0:9890 includes it, so the DaemonSet crashed on every worker with
      # "listen tcp :9890: bind: address already in use". A constant in a
      # never-deployed prototype has been validated by nothing.
      #
      # WHAT WAS MEASURED, on a live worker (ss -tlnH):
      #   22 53 4240 4244 9234 9878 9879 9890 9891 9963 9964 10248 10250
      #   plus the ephemeral range from 32768 (net.ipv4.ip_local_port_range)
      # Cilium owns nine of those, so 9891 or 9892 would be a bet on Cilium not
      # growing into its own neighbourhood.
      #
      # WHAT THAT MEASUREMENT DID NOT COVER, and it matters: the platform layer
      # had failed at step 6, so the monitoring stack was NOT installed and
      # node-exporter's 9100 never appeared in the list. The inventory was a
      # partial view of a half-built cluster, which is why the choice avoids
      # whole neighbourhoods instead of taking the next free number: Cilium's
      # 42xx/92xx/98xx/99xx, the kubelet's 102xx, the exporters' 90xx/91xx, the
      # NodePort range 30000-32767, and the ephemeral range.
      #
      # The smoke test asserts that whatever answers on this port is THIS
      # aggregator and not something that took it -- a check, not a note.
      #
      # hostNetwork: the aggregator asks the agent and Envoy over LOOPBACK,
      # because both bind 127.0.0.1 only -- that is the whole reason it has to
      # exist instead of repointing the health check at an existing port.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      # No tolerations on purpose: this must NOT run where the Gateway does not.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: node-readiness
          # PINNED BY DIGEST. The repository lives in the persistent stack so
          # this digest keeps naming something that exists after a destroy.
          image: 487985088962.dkr.ecr.eu-west-1.amazonaws.com/k8s-vanilla-lab-node-readiness@sha256:eb25278c2212c0215d94f6ce34b57f378d3e7ccb837a1c54b34663a90c8cf0ff
          imagePullPolicy: IfNotPresent
          ports:
            - name: readiness
              containerPort: 8910
              hostPort: 8910
              protocol: TCP
          env:
            - name: LISTEN_ADDR
              value: ":8910"
            - name: AGENT_HEALTH_URL
              value: "http://127.0.0.1:9879/healthz"
            - name: ENVOY_HEALTH_URL
              value: "http://127.0.0.1:9878/healthz"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          # Its own probes ask ITSELF over loopback, not the aggregate verdict:
          # a node whose Envoy is down must keep ANSWERING 503, not be restarted.
          # Probing /healthz here would make the pod die exactly when its answer
          # matters most.
          startupProbe:
            tcpSocket:
              port: 8910
            failureThreshold: 15
            periodSeconds: 2
          livenessProbe:
            tcpSocket:
              port: 8910
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 8910
            periodSeconds: 10
            failureThreshold: 3
      terminationGracePeriodSeconds: 5
