# node-readiness — per-node answer to "can this node serve Gateway traffic?"
#
# SCOPE: WORKERS ONLY, and that is not a preference. Verified in
# tofu/modules/nlb/main.tf: aws_lb_target_group.gateway (port 30443) is
# attached ONLY by aws_lb_target_group_attachment.workers, over
# var.worker_instance_ids. Control planes live in a separate target group for
# the API on 6443, whose health is a different question with a different
# answer. Running this on control planes would add a hostNetwork pod with
# root-adjacent reach and NO consumer.
#
# HOW workers-only is enforced, twice on purpose:
#   1. NO toleration for node-role.kubernetes.io/control-plane:NoSchedule.
#      kubeadm's taint is intact (bootstrap never removes it), so the pod
#      cannot land on a control plane.
#   2. An explicit nodeAffinity requiring the control-plane label to be
#      absent. Belt and braces: if anyone ever untaints the control planes,
#      (1) silently stops working and (2) still holds.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-readiness
  namespace: kube-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-readiness
  namespace: kube-system
  labels: {app.kubernetes.io/name: node-readiness}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: node-readiness}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 1}
  template:
    metadata:
      labels: {app.kubernetes.io/name: node-readiness}
    spec:
      serviceAccountName: node-readiness
      automountServiceAccountToken: false     # it never talks to the API server
      # hostNetwork is REQUIRED, not convenient: the upstreams it must reach
      # are bound to the NODE's 127.0.0.1, unreachable from a pod netns.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: system-node-critical  # must not be evicted before
                                               # the thing it reports on
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      # Deliberately NO toleration for the control-plane taint.
      tolerations:
        - key: node.kubernetes.io/not-ready
          effect: NoExecute
          operator: Exists
        - key: node.kubernetes.io/unreachable
          effect: NoExecute
          operator: Exists
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: node-readiness
          image: node-readiness:REPLACED_BY_PIPELINE   # ECR, SHA-pinned
          imagePullPolicy: IfNotPresent
          args: []
          env:
            - {name: LISTEN_ADDR,      value: "0.0.0.0:9890"}
            - {name: AGENT_HEALTH_URL, value: "http://127.0.0.1:9879/healthz"}
            - {name: ENVOY_HEALTH_URL, value: "http://127.0.0.1:9878/healthz"}
            - {name: PROBE_TIMEOUT,    value: "2s"}
          ports:
            - {name: readiness, containerPort: 9890, hostPort: 9890, protocol: TCP}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 5m,  memory: 16Mi}
            limits:   {cpu: 50m, memory: 32Mi}
          # Its OWN liveness is a bare TCP accept, NOT /healthz: /healthz
          # returns 503 whenever the node is unhealthy, and restarting this
          # pod for correctly reporting bad news would destroy the signal
          # exactly when it matters.
          livenessProbe:
            tcpSocket: {port: 9890}
            periodSeconds: 10
            failureThreshold: 3
