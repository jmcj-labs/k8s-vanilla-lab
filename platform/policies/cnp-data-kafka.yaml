# Network policy for the Kafka operand pods (deferred from phase 1, now
# with real ports). Selects the OPERAND pods by label — the Strimzi cluster
# operator and the entity operator stay unconstrained.
#
# Internal Strimzi ports, verified against the deployed cluster (not from
# memory): 9090 KRaft control plane, 9091 internal replication (also used
# by the cluster/entity operators for admin over TLS), 9093 our internal
# TLS listener for clients.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: data-kafka
  namespace: data
  labels:
    app.kubernetes.io/part-of: k8s-vanilla-lab-policies
spec:
  endpointSelector:
    matchLabels:
      # pool-name, NOT kind=Kafka: the entity operator also carries
      # cluster+kind labels and must stay outside this default-deny
      strimzi.io/pool-name: dual
  ingress:
    # App clients from logistics (TLS listener)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: logistics
      toPorts:
        - ports:
            - port: "9093"
              protocol: TCP
    # Broker↔broker / controller↔controller (KRaft + replication)
    - fromEndpoints:
        - matchLabels:
            strimzi.io/pool-name: dual
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
            - port: "9091"
              protocol: TCP
    # Strimzi cluster operator → brokers: admin (:9091) and KafkaAgent
    # healthcheck (:8443 — found live: without it the operator cannot read
    # broker configs and reconciliation stalls)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: data
            strimzi.io/kind: cluster-operator
      toPorts:
        - ports:
            - port: "9091"
              protocol: TCP
            - port: "8443"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: data
            app.kubernetes.io/name: entity-operator
      toPorts:
        - ports:
            - port: "9091"
              protocol: TCP
    # Prometheus scrape → JMX exporter metrics (phase 3a — the only CNP
    # change authorized in that phase)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: infra
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9404"
              protocol: TCP
  egress:
    # DNS pinned to kube-dns
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Peers (KRaft + replication)
    - toEndpoints:
        - matchLabels:
            strimzi.io/pool-name: dual
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
            - port: "9091"
              protocol: TCP
    # Brokers talk to the API server (found live: dual-0 dropped SYNs to
    # kube-apiserver and never became Ready under the CNP's default-deny)
    - toEntities:
        - kube-apiserver
