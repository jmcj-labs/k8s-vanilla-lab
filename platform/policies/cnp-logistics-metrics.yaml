# Prometheus (infra) → app pods in logistics, port `metrics`, and nothing
# else. Additive to the logistics default-deny (policies compose by union of
# allows). The app pods are the default-deny's endpointSelector {} target, so
# this opening is what lets Prometheus scrape them at all.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: logistics-metrics-scrape
  namespace: logistics
  labels:
    app.kubernetes.io/part-of: k8s-vanilla-lab-policies
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/part-of: logistics-lab
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: infra
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: metrics
              protocol: TCP
