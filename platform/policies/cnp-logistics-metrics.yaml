# Prometheus (infra) is the only ADDITIONAL cross-namespace source allowed to
# reach the app pods on the `metrics` port. Honest semantics: the logistics
# default-deny already permits intra-namespace traffic (fromEndpoints in
# logistics), so app→app within logistics also reaches `metrics` — this policy
# does NOT isolate metrics per service. Its job is solely to let Prometheus
# (a different namespace) scrape. Per-service / per-port isolation inside
# logistics is Phase 1.5 (L7/auth + policies per service).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: logistics-metrics-scrape
  namespace: logistics
  labels:
    app.kubernetes.io/part-of: k8s-vanilla-lab-policies
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/part-of: logistics-lab
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: infra
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: metrics
              protocol: TCP
