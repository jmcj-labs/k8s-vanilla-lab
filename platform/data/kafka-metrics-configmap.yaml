# JMX Prometheus Exporter rules for the Kafka brokers (Strimzi metricsConfig
# references this ConfigMap). Versioned here — never hand-edited in-cluster.
# Compact ruleset derived from Strimzi's kafka-metrics example: broker/server,
# network and log metrics — enough for the smoke's kafka_* sample check and
# the phase-3 dashboards.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-metrics
  namespace: data
  labels:
    app.kubernetes.io/part-of: k8s-vanilla-lab-data
data:
  kafka-metrics-config.yml: |
    lowercaseOutputName: true
    rules:
      # Broker/server general: kafka_server_<group>_<name>
      - pattern: kafka.server<type=(.+), name=(.+)PerSec\w*, topic=(.+)><>Count
        name: kafka_server_$1_$2_total
        type: COUNTER
        labels:
          topic: "$3"
      - pattern: kafka.server<type=(.+), name=(.+)PerSec\w*><>Count
        name: kafka_server_$1_$2_total
        type: COUNTER
      - pattern: kafka.server<type=(.+), name=(.+), clientId=(.+)><>Value
        name: kafka_server_$1_$2
        type: GAUGE
        labels:
          clientId: "$3"
      - pattern: kafka.server<type=(.+), name=(.+)><>Value
        name: kafka_server_$1_$2
        type: GAUGE
      # Controller (KRaft)
      - pattern: kafka.controller<type=(.+), name=(.+)><>Value
        name: kafka_controller_$1_$2
        type: GAUGE
      # Network request metrics
      - pattern: kafka.network<type=(.+), name=(.+)><>Value
        name: kafka_network_$1_$2
        type: GAUGE
      # Log metrics
      - pattern: kafka.log<type=(.+), name=(.+), topic=(.+), partition=(.+)><>Value
        name: kafka_log_$1_$2
        type: GAUGE
        labels:
          topic: "$3"
          partition: "$4"
