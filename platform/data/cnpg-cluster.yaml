# PostgreSQL cluster for logistics-lab — CNPG operator 1.30 (API v1).
#
# - 3 instances (1 primary + 2 replicas), synchronous to at least one
#   replica (minSyncReplicas 1), automatic failover by the operator.
# - REQUIRED anti-affinity by hostname: one instance per worker. With 3
#   workers this means a lost node leaves the third instance Pending —
#   expected and accepted (documented in CLUSTER.md); do NOT soften to
#   preferred.
# - PDB: CNPG manages its own (enablePDB defaults to true) — no manual PDB.
# - bootstrap.initdb creates database `logistics`, owner `logistics` and an
#   auto-generated credentials Secret (logistics-pg-app) — never in Git.
#   External Secrets arrives in Sprint 3; native Secret until then.
# - Metrics on :9187 scraped via the EXPLICIT PodMonitor
#   (podmonitor-postgres.yaml): monitoring.enablePodMonitor is deprecated
#   by CNPG and no longer used here.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: logistics-pg
  namespace: data
  labels:
    app.kubernetes.io/part-of: k8s-vanilla-lab-data
spec:
  instances: 3
  minSyncReplicas: 1
  maxSyncReplicas: 1
  primaryUpdateStrategy: unsupervised

  bootstrap:
    initdb:
      database: logistics
      owner: logistics

  storage:
    size: 5Gi
    storageClass: gp3

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
