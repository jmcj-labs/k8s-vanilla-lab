# PostgreSQL cluster for logistics-lab — CNPG operator 1.30 (API v1).
#
# - 3 instances (1 primary + 2 replicas), synchronous to at least one
#   replica (minSyncReplicas 1), automatic failover by the operator.
# - REQUIRED anti-affinity by hostname: one instance per worker. With 3
#   workers this means a lost node leaves the third instance Pending —
#   expected and accepted (documented in CLUSTER.md); do NOT soften to
#   preferred.
# - PDB: CNPG manages its own (enablePDB defaults to true) — no manual PDB.
# - bootstrap.initdb creates database `logistics`, owner `logistics` and an
#   auto-generated credentials Secret (logistics-pg-app) — never in Git.
#   External Secrets arrives in Sprint 3; native Secret until then.
# - Metrics on :9187 scraped via the EXPLICIT PodMonitor
#   (podmonitor-postgres.yaml): monitoring.enablePodMonitor is deprecated
#   by CNPG and no longer used here.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: logistics-pg
  namespace: data
  labels:
    app.kubernetes.io/part-of: k8s-vanilla-lab-data
spec:
  instances: 3
  minSyncReplicas: 1
  maxSyncReplicas: 1
  primaryUpdateStrategy: unsupervised

  bootstrap:
    initdb:
      database: logistics
      owner: logistics

  storage:
    size: 5Gi
    storageClass: gp3

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required

  # S2 piece 1: continuous WAL archiving + base backups to the persistent
  # bucket (tofu/envs/persistent, survives cluster destroy). Credentials are
  # the dedicated IAM user's keys (cnpg-backup-creds Secret, projected from
  # SSM by install.sh) — the IMDS CCNP denies the instance profile to these
  # pods and is not to be widened. In-tree barmanObjectStore on purpose:
  # supported through CNPG 1.x; the Barman Cloud plugin migration is noted
  # for the External Secrets sprint. Retention matches the bucket lifecycle
  # (14d). __BACKUP_BUCKET__ is substituted by platform/install.sh.
  backup:
    retentionPolicy: "14d"
    barmanObjectStore:
      destinationPath: s3://__BACKUP_BUCKET__/cnpg
      s3Credentials:
        accessKeyId:
          name: cnpg-backup-creds
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-backup-creds
          key: SECRET_ACCESS_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
