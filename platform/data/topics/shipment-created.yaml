# Platform owns the topic RESOURCE; Repo 2 owns the event CONTRACT (docs).
# The strimzi.io/cluster label is MANDATORY — without it the Topic Operator
# ignores the CR.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: shipment.created
  namespace: data
  labels:
    strimzi.io/cluster: logistics-kafka
    app.kubernetes.io/part-of: k8s-vanilla-lab-data
spec:
  partitions: 3
  replicas: 3
  config:
    min.insync.replicas: 2
