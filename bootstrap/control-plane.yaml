#!/bin/bash
# Control Plane bootstrap — FOUNDER node (index 0) of the HA control plane.
# Purpose: kubeadm init anchored to the NLB endpoint (kube-proxy-free),
#          install Cilium in strict kube-proxy replacement mode, publish the
#          join data + control-plane join material (SSM cp/ path) and open
#          the sequential-join gate for CP-1/CP-2 (control-plane-join.yaml).
# Variables: cluster_name, aws_region, pod_cidr, service_cidr, api_endpoint_dns, ssm_parameter_path

set -euo pipefail
exec >> /var/log/k8s-cp-bootstrap.log 2>&1

log() {
  echo "[$(date +'%Y-%m-%d %H:%M:%S')] $*"
}

log "=== Starting Control Plane bootstrap ==="

# Step 1: Wait for common.yaml bootstrap to complete
log "Step 1/9: Waiting for common bootstrap to complete"
TIMEOUT=600  # 10 minutes
ELAPSED=0
INTERVAL=10

while [ $${ELAPSED} -lt $${TIMEOUT} ]; do
  if grep -q "Step 8/8: Enabling kubelet service" /var/log/k8s-bootstrap.log 2>/dev/null && \
     grep -q "Common bootstrap completed successfully" /var/log/k8s-bootstrap.log 2>/dev/null; then
    log "✓ Common bootstrap completed"
    break
  fi

  if [ $${ELAPSED} -eq 0 ]; then
    log "Waiting for common bootstrap... (timeout: $${TIMEOUT}s)"
  fi

  sleep $${INTERVAL}
  ELAPSED=$((ELAPSED + INTERVAL))

  if [ $${ELAPSED} -ge $${TIMEOUT} ]; then
    log "✗ ERROR: Common bootstrap did not complete within $${TIMEOUT}s"
    log "Last 20 lines of bootstrap log:"
    tail -20 /var/log/k8s-bootstrap.log || true
    exit 1
  fi
done

# Step 1b: aws-iam-authenticator webhook material — MUST exist before
# kubeadm init (the API server starts with the webhook flags pointing at
# these files). If anything here fails, ABORT: continuing would produce a
# cluster silently missing IAM auth.
log "Step 1b/9: Installing aws-iam-authenticator v0.7.18 (server init)"

IAM_AUTH_VERSION="0.7.18"
IAM_AUTH_SHA256="fbebd5350dd1a5f377097fd1b2e1ca8c5a5e7ecb35cc44ddc694b775d498d7a5"

curl -fsSL -o /usr/local/bin/aws-iam-authenticator \
  "https://github.com/kubernetes-sigs/aws-iam-authenticator/releases/download/v$${IAM_AUTH_VERSION}/aws-iam-authenticator_$${IAM_AUTH_VERSION}_linux_amd64"
if ! echo "$${IAM_AUTH_SHA256}  /usr/local/bin/aws-iam-authenticator" | sha256sum -c -; then
  log "✗ ERROR: aws-iam-authenticator checksum mismatch — aborting bootstrap"
  exit 1
fi
chmod 0755 /usr/local/bin/aws-iam-authenticator

# clusterID disambiguated across accounts and regions: ACCOUNT.REGION.NAME —
# the exact same value is computed by platform/install.sh, the Makefile and
# the CI smoke.
ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
CLUSTER_ID="$${ACCOUNT_ID}.${aws_region}.${cluster_name}"
log "authenticator clusterID: $${CLUSTER_ID}"

# init (default feature gates) writes cert.pem/key.pem/aws-iam-authenticator.kubeconfig
# into the CURRENT directory; run it inside the server state dir and move the
# webhook kubeconfig where the API server expects it.
mkdir -p /var/aws-iam-authenticator /etc/kubernetes/aws-iam-authenticator
cd /var/aws-iam-authenticator
aws-iam-authenticator init -i "$${CLUSTER_ID}" 2>&1 | tee -a /var/log/k8s-cp-bootstrap.log
mv -f aws-iam-authenticator.kubeconfig /etc/kubernetes/aws-iam-authenticator/kubeconfig.yaml
cd /

for REQUIRED in /var/aws-iam-authenticator/cert.pem \
                /var/aws-iam-authenticator/key.pem \
                /etc/kubernetes/aws-iam-authenticator/kubeconfig.yaml; do
  if [ ! -s "$${REQUIRED}" ]; then
    log "✗ ERROR: authenticator init did not produce $${REQUIRED} — aborting bootstrap"
    exit 1
  fi
done
log "✓ aws-iam-authenticator webhook material in place"

# Step 2: Create kubeadm config file
log "Step 2/9: Creating kubeadm configuration"

# controlPlaneEndpoint is the NLB's DNS (ADR-007): every consumer — CP
# joins, worker joins, kubeconfigs, Cilium, kubelets — uses the same stable
# endpoint, and losing this founder node no longer strands the cluster.
# kubeadm puts the endpoint host into the API server cert SANs by itself.
PRIVATE_IP=$(hostname -i | awk '{print $1}')
log "Private IP: $${PRIVATE_IP}"
log "API endpoint (NLB): ${api_endpoint_dns}:6443"

# The NLB's DNS must resolve before kubeadm anchors to it (registration in
# Route53 is fast but not instant after the NLB is created).
DNS_ELAPSED=0
until getent hosts "${api_endpoint_dns}" >/dev/null 2>&1; do
  if [ $${DNS_ELAPSED} -ge 300 ]; then
    log "✗ ERROR: NLB DNS ${api_endpoint_dns} does not resolve after 300s"
    exit 1
  fi
  sleep 10
  DNS_ELAPSED=$((DNS_ELAPSED + 10))
done
log "✓ NLB DNS resolves"

cat > /tmp/kubeadm-config.yaml <<KUBEADM_EOF
apiVersion: kubeadm.k8s.io/v1beta4
kind: InitConfiguration
nodeRegistration:
  criSocket: unix:///run/containerd/containerd.sock
# kube-proxy is never installed: Cilium runs in strict kube-proxy
# replacement mode (kubeProxyReplacement=true + k8sServiceHost/Port below)
skipPhases:
  - addon/kube-proxy
---
apiVersion: kubeadm.k8s.io/v1beta4
kind: ClusterConfiguration
# Use the installed kubeadm version (latest 1.35.x from common bootstrap)
kubernetesVersion: $(kubeadm version -o short)
clusterName: ${cluster_name}
controlPlaneEndpoint: "${api_endpoint_dns}:6443"
apiServer:
  # IAM auth: token webhook against the local aws-iam-authenticator.
  # v1beta4 extraArgs is a {name,value} LIST (not a map). The webhook
  # version must be v1 explicitly (the kube-apiserver default is v1beta1).
  extraArgs:
    - name: authentication-token-webhook-config-file
      value: /etc/kubernetes/aws-iam-authenticator/kubeconfig.yaml
    - name: authentication-token-webhook-version
      value: v1
  extraVolumes:
    - name: aws-iam-authenticator
      hostPath: /etc/kubernetes/aws-iam-authenticator
      mountPath: /etc/kubernetes/aws-iam-authenticator
      readOnly: true
      pathType: Directory
  certSANs:
    - $${PRIVATE_IP}
    - $(hostname -f)
networking:
  podSubnet: ${pod_cidr}
  serviceSubnet: ${service_cidr}
KUBEADM_EOF

log "✓ kubeadm config created at /tmp/kubeadm-config.yaml"
cat /tmp/kubeadm-config.yaml >> /var/log/k8s-cp-bootstrap.log

# Step 3: Initialize control plane with kubeadm
log "Step 3/9: Running kubeadm init (this takes 2-5 minutes)"

kubeadm init \
  --config /tmp/kubeadm-config.yaml \
  --upload-certs \
  2>&1 | tee -a /var/log/k8s-cp-bootstrap.log

if [ $? -ne 0 ]; then
  log "✗ ERROR: kubeadm init failed"
  exit 1
fi

log "✓ kubeadm init completed successfully"

# Step 4: Configure kubectl for root user
log "Step 4/9: Configuring kubectl for root user"
mkdir -p /root/.kube
cp -f /etc/kubernetes/admin.conf /root/.kube/config
chown root:root /root/.kube/config
chmod 600 /root/.kube/config
export KUBECONFIG=/etc/kubernetes/admin.conf
log "✓ kubectl configured for root user"

# providerID note: spec.providerID is published by the kubelet itself via
# --provider-id, set in common.yaml (Step 7b) before kubeadm init — same
# mechanism on all nodes, so no post-init patch is needed here.

# Step 5: Install Cilium CNI in strict kube-proxy replacement mode
log "Step 5/9: Installing Cilium CNI (kube-proxy replacement)"

# Install Helm if not present (required to install Cilium chart)
if ! command -v helm >/dev/null 2>&1; then
  log "Helm not found, installing Helm 3"
  HELM_VERSION="v3.18.4"
  ARCH=$(dpkg --print-architecture)
  case "$${ARCH}" in
    amd64) HELM_ARCH="amd64" ;;
    arm64) HELM_ARCH="arm64" ;;
    *)
      log "✗ ERROR: Unsupported architecture for Helm install: $${ARCH}"
      exit 1
      ;;
  esac

  curl -fsSL \
    -o /tmp/helm.tar.gz \
    "https://get.helm.sh/helm-$${HELM_VERSION}-linux-$${HELM_ARCH}.tar.gz"
  tar -xzf /tmp/helm.tar.gz -C /tmp
  install -m 0755 "/tmp/linux-$${HELM_ARCH}/helm" /usr/local/bin/helm
  rm -rf /tmp/helm.tar.gz "/tmp/linux-$${HELM_ARCH}"
  log "✓ Helm installed"
fi

# Gateway API standard CRDs must exist BEFORE Cilium starts, so the operator
# enables its Gateway API controller. Applied here (fresh bootstrap); if
# Cilium were already installed, restart its operator to pick them up.
log "Installing Gateway API standard CRDs (v1.2.1)"
kubectl apply -f \
  https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.2.1/standard-install.yaml \
  2>&1 | tee -a /var/log/k8s-cp-bootstrap.log

if kubectl -n kube-system get deployment cilium-operator &>/dev/null; then
  log "Cilium already present; restarting cilium-operator to pick up Gateway API CRDs"
  kubectl -n kube-system rollout restart deployment/cilium-operator \
    2>&1 | tee -a /var/log/k8s-cp-bootstrap.log
fi

helm repo add cilium https://helm.cilium.io \
  2>&1 | tee -a /var/log/k8s-cp-bootstrap.log
helm repo update \
  2>&1 | tee -a /var/log/k8s-cp-bootstrap.log

# Strict kube-proxy replacement: kube-proxy was skipped at init, so Cilium
# needs the API server address explicitly (it cannot rely on the
# kubernetes.default Service before it is running itself).
helm upgrade --install cilium cilium/cilium \
  --namespace kube-system \
  --create-namespace \
  --version 1.19.6 \
  --set ipam.mode=kubernetes \
  --set kubeProxyReplacement=true \
  --set k8sServiceHost="${api_endpoint_dns}" \
  --set k8sServicePort=6443 \
  --set gatewayAPI.enabled=true \
  --set gatewayAPI.externalTrafficPolicy=Cluster \
  --set hubble.relay.enabled=true \
  --set hubble.ui.enabled=true \
  2>&1 | tee -a /var/log/k8s-cp-bootstrap.log

kubectl -n kube-system rollout status daemonset/cilium --timeout=300s \
  2>&1 | tee -a /var/log/k8s-cp-bootstrap.log
log "✓ Cilium CNI installed (kube-proxy replacement, Gateway API, Hubble)"

# Step 6: Verify API server is responding
log "Step 6/9: Verifying API server"
TIMEOUT=120
ELAPSED=0
INTERVAL=5

while [ $${ELAPSED} -lt $${TIMEOUT} ]; do
  if kubectl get nodes &>/dev/null; then
    log "✓ API server is responding"
    kubectl get nodes >> /var/log/k8s-cp-bootstrap.log
    break
  fi

  sleep $${INTERVAL}
  ELAPSED=$((ELAPSED + INTERVAL))

  if [ $${ELAPSED} -ge $${TIMEOUT} ]; then
    log "✗ ERROR: API server not responding after $${TIMEOUT}s"
    log "Kubelet status:"
    systemctl status kubelet >> /var/log/k8s-cp-bootstrap.log || true
    exit 1
  fi
done

# Step 7: Generate and store join data in SSM Parameter Store
log "Step 7/9: Generating join data and storing in SSM"

# Generate bootstrap token with 24h TTL
JOIN_TOKEN=$(kubeadm token create --ttl 24h)
log "✓ Bootstrap token generated (TTL: 24h)"

# Extract CA certificate hash
CA_CERT_HASH=$(openssl x509 -pubkey -in /etc/kubernetes/pki/ca.crt | \
               openssl rsa -pubin -outform der 2>/dev/null | \
               openssl dgst -sha256 -hex | \
               sed 's/^.* //')
log "✓ CA certificate hash extracted"

# API endpoint for every join is the NLB (ADR-007): workers and joining
# control planes must not anchor to this node's IP — it can die.
API_ENDPOINT="${api_endpoint_dns}:6443"

# Construct full join command
JOIN_COMMAND="kubeadm join $${API_ENDPOINT} --token $${JOIN_TOKEN} --discovery-token-ca-cert-hash sha256:$${CA_CERT_HASH}"

# Control-plane join material: re-upload the certs Secret (kubeadm-certs)
# and capture the fresh certificate-key deterministically — the phase
# prints ONLY the key on its last line. 2h TTL: replacements arriving
# later need the renewal ceremony (scripts/renew-cp-certificate-key.sh).
CERT_KEY=$(kubeadm init phase upload-certs --upload-certs 2>/dev/null | tail -1)
if ! echo "$${CERT_KEY}" | grep -Eq '^[0-9a-f]{64}$'; then
  log "✗ ERROR: could not capture a valid certificate-key from upload-certs"
  exit 1
fi
log "✓ certificate-key captured (kubeadm-certs Secret TTL: 2h)"

log "Storing parameters in SSM (region: ${aws_region}):"
log "  - ${ssm_parameter_path}/join-command"
log "  - ${ssm_parameter_path}/ca-cert-hash"
log "  - ${ssm_parameter_path}/api-endpoint"
log "  - ${ssm_parameter_path}/cp/certificate-key (CP-role-only path)"

# Store join command (SecureString)
aws ssm put-parameter \
  --name "${ssm_parameter_path}/join-command" \
  --value "$${JOIN_COMMAND}" \
  --type SecureString \
  --overwrite \
  --region ${aws_region} \
  2>&1 | tee -a /var/log/k8s-cp-bootstrap.log

# Store CA cert hash (SecureString)
aws ssm put-parameter \
  --name "${ssm_parameter_path}/ca-cert-hash" \
  --value "$${CA_CERT_HASH}" \
  --type SecureString \
  --overwrite \
  --region ${aws_region} \
  2>&1 | tee -a /var/log/k8s-cp-bootstrap.log

# Store API endpoint (SecureString)
aws ssm put-parameter \
  --name "${ssm_parameter_path}/api-endpoint" \
  --value "$${API_ENDPOINT}" \
  --type SecureString \
  --overwrite \
  --region ${aws_region} \
  2>&1 | tee -a /var/log/k8s-cp-bootstrap.log

# Store certificate-key under the cp/ subpath — readable by the CP role
# ONLY (the worker role enumerates exact ARNs and never sees cp/*): with
# it, anyone holding the join token could elevate to control plane.
aws ssm put-parameter \
  --name "${ssm_parameter_path}/cp/certificate-key" \
  --value "$${CERT_KEY}" \
  --type SecureString \
  --overwrite \
  --region ${aws_region} \
  >/dev/null 2>&1 || { log "✗ ERROR: failed to store certificate-key"; exit 1; }
log "✓ certificate-key stored (never logged)"

if [ $? -eq 0 ]; then
  log "✓ Join data stored in SSM successfully"
else
  log "✗ ERROR: Failed to store join data in SSM"
  exit 1
fi

# Step 8: Publish kubeconfig to SSM for CI smoke test.
# admin.conf already points at the NLB (controlPlaneEndpoint) — the sed is
# a belt-and-braces normalization, no longer a private→public rewrite.
log "Step 8/9: Publishing kubeconfig to SSM for CI smoke test"
KUBECONFIG_PATCHED=$(sed \
  "s|server: https://.*:6443|server: https://${api_endpoint_dns}:6443|" \
  /etc/kubernetes/admin.conf)
aws ssm put-parameter \
  --name "${ssm_parameter_path}/kubeconfig" \
  --value "$${KUBECONFIG_PATCHED}" \
  --type SecureString \
  --tier Advanced \
  --overwrite \
  --region ${aws_region} \
  2>&1 | tee -a /var/log/k8s-cp-bootstrap.log
log "✓ Kubeconfig stored at ${ssm_parameter_path}/kubeconfig"

# Step 9: Open the sequential-join gate for the other control planes.
# LAST on purpose: CP-1 only starts joining once this founder is COMPLETE
# (Cilium installed, join material published). The kubeadm HA guide
# requires control-plane joins one at a time; CP-1 waits for count>=1,
# CP-2 for count>=2 — each publishes its own increment after joining.
log "Step 9/9: Opening control-plane join gate (cp/joined-count = 1)"
aws ssm put-parameter \
  --name "${ssm_parameter_path}/cp/joined-count" \
  --value "1" \
  --type String \
  --overwrite \
  --region ${aws_region} \
  2>&1 | tee -a /var/log/k8s-cp-bootstrap.log
log "✓ Join gate open"

# Final status
log "=== Control Plane bootstrap completed successfully ==="
log "Cluster info:"
kubectl cluster-info >> /var/log/k8s-cp-bootstrap.log
log "Node status:"
kubectl get nodes -o wide >> /var/log/k8s-cp-bootstrap.log
log ""
log "CNI: Cilium installed (strict kube-proxy replacement, Gateway API, Hubble), pod networking is ready"
log "Workers can now join using parameters from SSM: ${ssm_parameter_path}/*"
