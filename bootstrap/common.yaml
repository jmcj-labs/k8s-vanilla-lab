#!/bin/bash
# Common bootstrap for Kubernetes nodes (control-plane + workers)
# Purpose: Install containerd, kubeadm, kubelet, kubectl (K8s 1.35.x series)
# NO variables in this file — loaded with file() not templatefile()

set -euo pipefail
exec >> /var/log/k8s-bootstrap.log 2>&1

log() {
  echo "[$(date +'%Y-%m-%d %H:%M:%S')] $*"
}

log "=== Starting Kubernetes common bootstrap ==="

# Step 0: Create required config files
log "Step 0/8: Creating kernel module and sysctl config files"

cat > /etc/modules-load.d/k8s.conf <<EOF
overlay
br_netfilter
EOF

cat > /etc/sysctl.d/k8s.conf <<EOF
net.bridge.bridge-nf-call-iptables  = 1
net.bridge.bridge-nf-call-ip6tables = 1
net.ipv4.ip_forward                 = 1
EOF

log "✓ Config files created"

# Step 1: Install required packages
log "Step 1/8: Installing base dependencies"
apt-get update
apt-get install -y apt-transport-https ca-certificates curl gnupg lsb-release

# Step 2: Install containerd from Docker repository (not Ubuntu default)
log "Step 2/8: Installing containerd from Docker repository"
install -m 0755 -d /etc/apt/keyrings
curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
chmod a+r /etc/apt/keyrings/docker.gpg

echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | \
  tee /etc/apt/sources.list.d/docker.list > /dev/null

apt-get update
# Latest containerd from the Docker repository (2.3.x at sprint time).
# Unpinned on purpose: the Docker repo only ships maintained releases.
apt-get install -y containerd.io

# Step 2a: Configure containerd with SystemdCgroup
log "Step 2a/8: Configuring containerd with systemd cgroup driver (config v3)"
mkdir -p /etc/containerd
containerd config default > /etc/containerd/config.toml

# CRITICAL: Set SystemdCgroup = true for runc runtime
# This must match kubelet's cgroup driver (systemd) to avoid kubelet failures
# NOTE: containerd 2.x uses config v3 with different plugin path structure
# v2: [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc.options]
# v3: [plugins.'io.containerd.cri.v1.runtime'.containerd.runtimes.runc.options]

# Detect config version and apply correct sed pattern
if grep -q "version = 3" /etc/containerd/config.toml; then
  log "Detected containerd config version 3 (containerd 2.x)"
  sed -i '/\[plugins.'\''io\.containerd\.cri\.v1\.runtime'\''.containerd.runtimes.runc.options\]/,/^$/s/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml
else
  log "Detected containerd config version 2 (containerd 1.x)"
  sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml
fi

# Verify the change was applied
if grep -q "SystemdCgroup = true" /etc/containerd/config.toml; then
  log "✓ containerd SystemdCgroup correctly set to true"
else
  log "✗ ERROR: Failed to set containerd SystemdCgroup = true"
  exit 1
fi

systemctl enable containerd
systemctl restart containerd
log "✓ containerd installed and configured"

# Step 3: Disable swap permanently
log "Step 3/8: Disabling swap"
swapoff -a
sed -i '/ swap / s/^/#/' /etc/fstab
log "✓ Swap disabled"

# Step 4: Load kernel modules
log "Step 4/8: Loading kernel modules (overlay, br_netfilter)"
modprobe overlay
modprobe br_netfilter
log "✓ Kernel modules loaded"

# Step 5: Apply sysctl parameters
log "Step 5/8: Applying sysctl parameters for Kubernetes networking"
sysctl --system
log "✓ sysctl parameters applied"

# Step 6: Add Kubernetes repository
log "Step 6/8: Adding Kubernetes v1.35 repository"
install -m 0755 -d /etc/apt/keyrings
curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.35/deb/Release.key | \
  gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg

cat > /etc/apt/sources.list.d/kubernetes.list <<EOF
deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.35/deb/ /
EOF

apt-get update
log "✓ Kubernetes repository added"

# Step 7: Install kubeadm, kubelet, kubectl (latest of the 1.35 series)
# The apt repo added in Step 6 is series-scoped (stable:/v1.35), so an
# unpinned install always resolves to the newest 1.35.x patch.
log "Step 7/8: Installing kubelet, kubeadm, kubectl (v1.35 series)"
apt-get install -y kubelet kubeadm kubectl
apt-mark hold kubelet kubeadm kubectl
log "✓ Kubernetes packages installed and held"

# Step 7a: Install AWS CLI v2 (required for SSM Parameter Store operations)
log "Step 7a/8: Installing AWS CLI v2"
curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "/tmp/awscliv2.zip"
apt-get install -y unzip
unzip -q /tmp/awscliv2.zip -d /tmp
/tmp/aws/install
rm -rf /tmp/aws /tmp/awscliv2.zip
aws --version
log "✓ AWS CLI v2 installed"

# Step 8: Enable kubelet (don't start — kubeadm will handle that)
log "Step 8/8: Enabling kubelet service"
systemctl enable kubelet
log "✓ kubelet enabled (will be started by kubeadm)"

# Verification
log "=== Bootstrap verification ==="
log "containerd version: $(containerd --version)"
log "kubelet version: $(kubelet --version)"
log "kubeadm version: $(kubeadm version -o short)"
log "kubectl version: $(kubectl version --client -o yaml | grep gitVersion)"

log "=== Common bootstrap completed successfully ==="
