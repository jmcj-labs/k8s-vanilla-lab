name: Apply

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "apply" to confirm'
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    name: Apply Infrastructure
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'apply'
    defaults:
      run:
        working-directory: tofu/envs/lab

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.8.0
          tofu_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Generate backend.hcl
        env:
          TF_BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          cat > backend.hcl << BACKENDCFG
          bucket         = "${TF_BACKEND_BUCKET}"
          key            = "k8s-vanilla-lab/terraform.tfstate"
          region         = "${AWS_REGION}"
          encrypt        = true
          dynamodb_table = "k8s-vanilla-lab-tflock"
          BACKENDCFG

      - name: OpenTofu Init
        run: tofu init -backend-config=backend.hcl

      - name: OpenTofu Apply
        env:
          TF_VAR_my_ip: ${{ vars.TF_VAR_MY_IP }}
          TF_VAR_ssh_key_name: ${{ vars.TF_VAR_SSH_KEY_NAME }}
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
          TF_VAR_aws_profile: ""
        run: tofu apply -auto-approve -no-color

      - name: Smoke test
        env:
          CLUSTER_NAME: ${{ vars.CLUSTER_NAME || 'k8s-vanilla-lab' }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          echo "Waiting 15 minutes for cluster bootstrap..."
          sleep 900
          make smoke-test CLUSTER_NAME="${CLUSTER_NAME}" AWS_REGION="${AWS_REGION}"
        working-directory: .

      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL}" ]; then exit 0; fi
          COLOR=$([[ "${STATUS}" == "success" ]] && echo "good" || echo "danger")
          curl -s -X POST "${SLACK_WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -d "{\"attachments\":[{\"color\":\"${COLOR}\",\"text\":\"k8s-vanilla-lab apply *${STATUS}* | <${RUN_URL}|View run>\"}]}"
