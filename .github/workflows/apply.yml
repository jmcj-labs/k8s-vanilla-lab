name: Apply

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "apply" to confirm'
        required: true

permissions:
  id-token: write
  contents: read

# Shared group with destroy.yml: any two runs touching the tofu state fight
# over the state lock (and applies also over Helm operations, observed
# 2026-08-10). A queued run waits for the active one to finish.
concurrency:
  group: tofu-state
  cancel-in-progress: false

jobs:
  apply:
    name: Apply Infrastructure
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'apply'
    defaults:
      run:
        working-directory: tofu/envs/lab

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.8.0
          tofu_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Generate backend.hcl
        env:
          TF_BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          cat > backend.hcl << BACKENDCFG
          bucket         = "${TF_BACKEND_BUCKET}"
          key            = "k8s-vanilla-lab/terraform.tfstate"
          region         = "${AWS_REGION}"
          encrypt        = true
          dynamodb_table = "k8s-vanilla-lab-tflock"
          BACKENDCFG

      - name: OpenTofu Init
        run: tofu init -backend-config=backend.hcl

      - name: OpenTofu Apply
        env:
          TF_VAR_my_ip: ${{ vars.TF_VAR_MY_IP }}
          TF_VAR_ssh_key_name: ${{ vars.TF_VAR_SSH_KEY_NAME }}
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
          TF_VAR_aws_profile: ""
        run: tofu apply -auto-approve -no-color

      - name: Install platform layer
        env:
          CLUSTER_NAME: ${{ vars.CLUSTER_NAME || 'k8s-vanilla-lab' }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          # Poll SSM for the kubeconfig (published at the end of the CP bootstrap)
          # instead of a blind sleep: a fresh cluster takes 8-12 min, a re-run on
          # a live cluster proceeds immediately — the workflow is re-entrant.
          echo "Waiting for cluster bootstrap (SSM kubeconfig, max 20 min)..."
          ELAPSED=0
          until aws ssm get-parameter \
              --name "/k8s/${CLUSTER_NAME}/kubeconfig" \
              --region "${AWS_REGION}" >/dev/null 2>&1; do
            if [ "${ELAPSED}" -ge 1200 ]; then
              echo "✗ Kubeconfig not in SSM after 20 min — CP bootstrap failed"
              exit 1
            fi
            sleep 30
            ELAPSED=$((ELAPSED + 30))
            echo "  ...still bootstrapping (${ELAPSED}s)"
          done
          echo "✓ Kubeconfig available after ${ELAPSED}s"
          make platform CLUSTER_NAME="${CLUSTER_NAME}" AWS_REGION="${AWS_REGION}"
        working-directory: .

      - name: Smoke test
        env:
          CLUSTER_NAME: ${{ vars.CLUSTER_NAME || 'k8s-vanilla-lab' }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          make smoke-test CLUSTER_NAME="${CLUSTER_NAME}" AWS_REGION="${AWS_REGION}"
        working-directory: .

      - name: Diagnostics on failure
        if: failure()
        env:
          CLUSTER_NAME: ${{ vars.CLUSTER_NAME || 'k8s-vanilla-lab' }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        working-directory: .
        run: |
          KUBECONFIG_FILE=$(mktemp)
          trap 'rm -f "${KUBECONFIG_FILE}"' EXIT
          if ! aws ssm get-parameter \
              --name "/k8s/${CLUSTER_NAME}/kubeconfig" \
              --with-decryption \
              --query Parameter.Value \
              --output text \
              --region "${AWS_REGION}" > "${KUBECONFIG_FILE}" 2>/dev/null; then
            echo "No kubeconfig in SSM — CP bootstrap did not complete; nothing to inspect"
            exit 0
          fi
          chmod 600 "${KUBECONFIG_FILE}"
          export KUBECONFIG="${KUBECONFIG_FILE}"
          echo "=== NODES ==="
          kubectl get nodes -o wide || true
          echo "=== PODS (all namespaces) ==="
          kubectl get pods -A -o wide || true
          echo "=== HELM RELEASES ==="
          helm list -A || true
          echo "=== DESCRIBE + LOGS OF NON-RUNNING PODS ==="
          kubectl get pods -A --no-headers 2>/dev/null \
            | awk '$4 != "Running" && $4 != "Completed" {print $1, $2}' \
            | while read -r ns pod; do
                echo "--- describe ${ns}/${pod} ---"
                kubectl -n "${ns}" describe pod "${pod}" | tail -30 || true
                # Per-container logs: only containers that actually restarted get
                # a --previous dump, to keep the output signal-only
                kubectl -n "${ns}" get pod "${pod}" \
                  -o jsonpath='{range .status.containerStatuses[*]}{.name}{" "}{.restartCount}{"\n"}{end}' 2>/dev/null \
                  | while read -r cname restarts; do
                      echo "--- logs ${ns}/${pod} [${cname}] (current) ---"
                      kubectl -n "${ns}" logs "${pod}" -c "${cname}" --tail=100 2>&1 || true
                      if [ "${restarts:-0}" -gt 0 ]; then
                        echo "--- logs ${ns}/${pod} [${cname}] (previous crash) ---"
                        kubectl -n "${ns}" logs "${pod}" -c "${cname}" --tail=100 --previous 2>&1 || true
                      fi
                    done
              done
          echo "=== CILIUM MASQUERADING ==="
          kubectl -n kube-system exec ds/cilium -c cilium-agent -- \
            cilium-dbg status --verbose 2>/dev/null | grep -iA4 "Masquerading" || true
          echo "--- bpf ipmasq list ---"
          kubectl -n kube-system exec ds/cilium -c cilium-agent -- \
            cilium-dbg bpf ipmasq list 2>&1 || true
          echo "--- cilium-config masquerade keys ---"
          kubectl -n kube-system get configmap cilium-config \
            -o jsonpath='{.data}' 2>/dev/null \
            | tr ',' '\n' | grep -i "masq\|ipv4-native\|routing-mode" || true
          echo "--- iptables NAT (via cilium agent, host netns) ---"
          kubectl -n kube-system exec ds/cilium -c cilium-agent -- \
            iptables-save -t nat 2>&1 | grep -i "CILIUM_POST\|MASQUERADE\|169.254" || true
          echo "=== EVENTS (most recent 50) ==="
          kubectl get events -A --sort-by=.lastTimestamp 2>/dev/null | tail -50 || true

      - name: Record deployment timestamp in SSM
        env:
          CLUSTER_NAME: ${{ vars.CLUSTER_NAME || 'k8s-vanilla-lab' }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          DEPLOYED_AT=$(date +%s)
          aws ssm put-parameter \
            --name "/k8s/${CLUSTER_NAME}/deployed-at" \
            --value "${DEPLOYED_AT}" \
            --type String \
            --overwrite \
            --region "${AWS_REGION}"

  # No checkout, no backend, no tofu: each job runs on a fresh runner, and
  # everything this notifier reports is available from the EC2/SSM APIs —
  # keeping OpenTofu out avoids state-lock contention and a toolchain dep
  # (its absence is exactly what broke this job's first-ever execution).
  notify-slack:
    name: Notify Slack
    runs-on: ubuntu-latest
    needs: apply
    if: needs.apply.result == 'success' && github.actor != 'dependabot[bot]'

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Collect Slack context values
        id: context
        env:
          CLUSTER_NAME: ${{ vars.CLUSTER_NAME || 'k8s-vanilla-lab' }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          API_ENDPOINT=$(aws ssm get-parameter \
            --name "/k8s/${CLUSTER_NAME}/api-endpoint" \
            --with-decryption \
            --query Parameter.Value \
            --output text \
            --region "${AWS_REGION}" 2>/dev/null || echo "unknown")

          WORKER_COUNT=$(aws ec2 describe-instances \
            --filters "Name=tag:kubernetes.io/cluster/${CLUSTER_NAME},Values=owned" \
                      "Name=tag:Role,Values=worker" \
                      "Name=instance-state-name,Values=running" \
            --query 'length(Reservations[].Instances[])' \
            --output text \
            --region "${AWS_REGION}" 2>/dev/null || echo "2")
          NODE_COUNT=$((WORKER_COUNT + 1))

          INSTANCE_TYPES=$(aws ec2 describe-instances \
            --filters "Name=tag:kubernetes.io/cluster/${CLUSTER_NAME},Values=owned" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceType' \
            --output json \
            --region "${AWS_REGION}" | jq -r 'if length==0 then "unknown" else group_by(.) | map("\(.[0]) x\(length)") | join(", ") end')

          CONTROL_PLANE_RATE=0.038
          WORKER_SPOT_RATE=0.0055
          HOURLY_COST=$(awk "BEGIN {printf \"%.3f\", ${CONTROL_PLANE_RATE} + (${WORKER_COUNT} * ${WORKER_SPOT_RATE})}")
          EPOCH=$(date +%s)

          echo "api_endpoint=${API_ENDPOINT}" >> "${GITHUB_OUTPUT}"
          echo "node_count=${NODE_COUNT}" >> "${GITHUB_OUTPUT}"
          echo "instance_types=${INSTANCE_TYPES}" >> "${GITHUB_OUTPUT}"
          echo "hourly_cost=${HOURLY_COST}" >> "${GITHUB_OUTPUT}"
          echo "epoch=${EPOCH}" >> "${GITHUB_OUTPUT}"

      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          NODE_COUNT: ${{ steps.context.outputs.node_count }}
          API_ENDPOINT: ${{ steps.context.outputs.api_endpoint }}
          INSTANCE_TYPES: ${{ steps.context.outputs.instance_types }}
          HOURLY_COST: ${{ steps.context.outputs.hourly_cost }}
          GIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EPOCH: ${{ steps.context.outputs.epoch }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL}" ]; then exit 0; fi

          PAYLOAD=$(jq -n \
            --arg NODE_COUNT "${NODE_COUNT}" \
            --arg API_ENDPOINT "${API_ENDPOINT}" \
            --arg INSTANCE_TYPES "${INSTANCE_TYPES}" \
            --arg HOURLY_COST "${HOURLY_COST}" \
            --arg GIT_SHA "${GIT_SHA}" \
            --arg ACTOR "${ACTOR}" \
            --arg RUN_URL "${RUN_URL}" \
            --arg EPOCH "${EPOCH}" \
            '{
              attachments: [{
                color: "#2eb67d",
                blocks: [
                  { type: "header", text: { type: "plain_text", text: "🟢 Cluster desplegado: k8s-vanilla-lab" } },
                  { type: "section", fields: [
                    { type: "mrkdwn", text: "*Región:*\neu-west-1" },
                    { type: "mrkdwn", text: "*K8s:*\nv1.35.x" },
                    { type: "mrkdwn", text: ("*Nodos:*\n" + $NODE_COUNT) },
                    { type: "mrkdwn", text: ("*API endpoint:*\n" + $API_ENDPOINT) },
                    { type: "mrkdwn", text: ("*Instancias:*\n" + $INSTANCE_TYPES) },
                    { type: "mrkdwn", text: ("*Coste/hora:*\n~$" + $HOURLY_COST) }
                  ]},
                  { type: "context", elements: [
                    { type: "mrkdwn", text: ("commit `" + $GIT_SHA + "` · por " + $ACTOR + " · <" + $RUN_URL + "|run> · <!date^" + $EPOCH + "^{date_short} {time}|now>") }
                  ]}
                ]
              }]
            }')

          curl --fail-with-body -sS -X POST "${SLACK_WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}"
