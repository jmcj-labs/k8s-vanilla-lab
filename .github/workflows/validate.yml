name: Validate

on:
  pull_request:
    paths:
      - "tofu/**"
      - "bootstrap/**"
      - "platform/**"
      - "scripts/**"
      - "docs/**"
      - "Makefile"
      - ".pre-commit-config.yaml"
      - ".tflint.hcl"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "tofu/**"
      - "bootstrap/**"
      - "platform/**"
      - "scripts/**"
      - "docs/**"
      - "Makefile"
      - ".pre-commit-config.yaml"
      - ".tflint.hcl"
      - ".github/workflows/**"

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    name: Format · Validate · Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tofu/envs/lab

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.8.0
          tofu_wrapper: false

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: v0.70.0

      - name: Install tflint
        uses: terraform-linters/setup-tflint@v6.3.0
        with:
          tflint_version: v0.62.1

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

      - name: Validate (fmt + syntax, no AWS needed)
        run: make validate
        working-directory: .

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Plan the lab stack against an EMPTY state (local backend, everything
      # to create). This is the coronation scenario and the ONLY place a
      # count/for_each depending on a known-after-apply value surfaces —
      # INCIDENTS #11. Runs before the stateful plan so the invariant is
      # checked even if the real state hides the bug.
      - name: Plan from empty state (INCIDENTS #11 guardrail)
        run: make plan-empty
        working-directory: .

      - name: Generate backend.hcl
        env:
          TF_BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          cat > backend.hcl << BACKENDCFG
          bucket         = "${TF_BACKEND_BUCKET}"
          key            = "k8s-vanilla-lab/terraform.tfstate"
          region         = "${AWS_REGION}"
          encrypt        = true
          dynamodb_table = "k8s-vanilla-lab-tflock"
          BACKENDCFG

      - name: OpenTofu Init
        run: tofu init -backend-config=backend.hcl

      - name: OpenTofu Plan
        env:
          TF_VAR_my_ip: ${{ vars.TF_VAR_MY_IP }}
          TF_VAR_ssh_key_name: ${{ vars.TF_VAR_SSH_KEY_NAME }}
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
          TF_VAR_aws_profile: ""
          TF_VAR_lab_account_id: ${{ vars.LAB_ACCOUNT_ID }}
        # -lock=false: the plan is read-only and speculative; without it,
        # pushes to main during an apply/destroy run fail on the state lock.
        run: tofu plan -no-color -lock=false
